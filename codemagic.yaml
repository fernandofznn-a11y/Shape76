workflows:
  ios-release:
    name: Shape76 iOS

    environment:
      node: 22.0.0

    scripts:
      - npm install
      - npm run build
      - npx cap sync ios
      - xcode-project build-ipa \
          --project ios/App/App.xcodeproj \
          --scheme App

    artifacts:
      - build/ios/ipa/*.ipa