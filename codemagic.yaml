workflows:
  ios-release:
    name: Shape76 iOS

    environment:
      xcode: latest
      node: 22.0.0

    scripts:
      - npm install
      - npm run build
      - npx cap sync ios
      - xcodebuild -project ios/App/App.xcodeproj -scheme App -destination "generic/platform=iOS" -archivePath build/Shape76.xcarchive archive
      - xcodebuild -exportArchive -archivePath build/Shape76.xcarchive -exportPath build/ios/ipa -allowProvisioningUpdates

    artifacts:
      - build/ios/ipa/*.ipa