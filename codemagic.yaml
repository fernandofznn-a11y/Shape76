workflows:
  ios-release:
    name: Shape76 iOS

    environment:
      node: 22.0.0
      xcode: latest

    scripts:
      - npm install
      - npm run build
      - npx cap sync ios
      - cd ios/App
      - pod install
      - xcode-project use-profiles
      - xcode-project build-ipa --workspace App.xcworkspace --scheme App

    artifacts:
      - ios/App/build/ios/ipa/*.ipa